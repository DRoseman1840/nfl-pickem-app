# Save this file to: .github/workflows/sync_nfl_data.yml in your repo
#
# Before this works, add two repository secrets:
#   Settings > Secrets and variables > Actions > New repository secret
#     SUPABASE_URL           -> https://txgwpaaaecbxivzuosmr.supabase.co
#     SUPABASE_SERVICE_KEY   -> your Supabase SERVICE ROLE key (Project Settings > API)
#                                Do NOT use the anon key here, and never commit this
#                                key to the repo itself.

name: Sync NFL Schedule & Scores

on:
  schedule:
    # Every 15 minutes during typical game windows (all times UTC):
    # Thursday (4), Sunday (0), Monday (1) afternoons/evenings.
    # Adjust for your timezone and for playoff Saturdays as needed.
    - cron: "*/15 17-23 * * 0,1,4"
    # Once a day to pick up schedule changes (flex scheduling, byes, etc.)
    - cron: "0 12 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests supabase

      - name: Run schedule/score sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python fetch_schedule.py
